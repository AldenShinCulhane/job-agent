[project]
name = "job-agent"
version = "2.0.0.dev0"
description = "LinkedIn-native tailoring studio — scored job search with tailored LaTeX resume + cover letter PDFs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "claude-agent-sdk>=0.1.0",
    "pydantic>=2.10",
]

[project.scripts]
job-agent = "backend.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
